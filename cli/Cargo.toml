[package]
name = "nero-cli"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "The nero command: the taskbar setup and the Argos system monitor, on top of Nero's Rust core"
publish = false

[[bin]]
name = "nero"
path = "src/main.rs"

[dependencies]
nero-core = { path = "../core" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
