name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and the Nero version (release or commit)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Error messages or log output, if any
      render: text
