name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y gjs libglib2.0-bin lua5.4
      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown && rustup component add clippy rustfmt
      - name: Rust core (fmt, clippy, tests)
        working-directory: core
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
      - run: ./tilingshell-patch/apply.sh
      # (core/build.sh --check here compared apply.sh's fresh copies with themselves;
      # tests/test-build-check.sh in run.sh tests the check itself)
      - run: ./tests/run.sh
      - name: syntax of every patched Tiling Shell file
        run: find build/tilingshell@ferrarodomenico.com -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --check core/js/helpers.js
      - run: node --check keep-onscreen/nero-keep-onscreen@LudaLunizz/extension.js
      - run: node --check keep-onscreen/nero-keep-onscreen@LudaLunizz/prefs.js
      - run: glib-compile-schemas --strict --dry-run keep-onscreen/nero-keep-onscreen@LudaLunizz/schemas
      - run: node --check nero-layout/nero-layout@LudaLunizz/extension.js
      - run: glib-compile-schemas --strict --dry-run nero-layout/nero-layout@LudaLunizz/schemas
      - run: node --check nero-workspaces/nero-workspaces@LudaLunizz/extension.js
      - run: node --check nero-workspaces/nero-workspaces@LudaLunizz/prefs.js
      - run: node --check nero-workspaces/nero-workspaces@LudaLunizz/scrollSpeed.js
      - run: lua5.4 tests/test-scroll-plugin.lua
      - run: glib-compile-schemas --strict --dry-run nero-workspaces/nero-workspaces@LudaLunizz/schemas
      - run: node --check taskbar/nero-argos-split@LudaLunizz/extension.js
      - run: glib-compile-schemas --strict --dry-run taskbar/nero-argos-split@LudaLunizz/schemas
      - name: nero command (fmt, clippy, tests)
        working-directory: cli
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
