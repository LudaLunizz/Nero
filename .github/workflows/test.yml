name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y gjs libglib2.0-bin
      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown && rustup component add clippy rustfmt
      - name: Rust core (fmt, clippy, tests)
        working-directory: core
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
      - run: ./tilingshell-patch/apply.sh
      - run: ./tests/run.sh
      - run: node --check keep-onscreen/keep-onscreen@LudaLunizz/extension.js
