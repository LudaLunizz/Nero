[package]
name = "nero-core"
version = "0.2.8"
edition = "2024"
license = "MIT"
description = "Window placement logic of Nero (free space, frames, fluid drag shape, line groups), built to WebAssembly for GNOME Shell"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
