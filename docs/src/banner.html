<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { height: 300px; display: flex; align-items: center; padding: 0 44px; }

  .scene { position: relative; margin-left: auto; width: 392px; height: 236px; flex: none; }
