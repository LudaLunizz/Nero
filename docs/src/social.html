<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { width: 640px; height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .name { display: flex; align-items: center; gap: 18px; }
  .name img { width: 84px; height: 84px; }
  h1 { font-size: 84px; line-height: 1; font-weight: 800; letter-spacing: -3px; }
  .tag { font-size: 25px; color: var(--muted); margin-top: 16px; }
  .tag b { color: var(--text); font-weight: 600; }
  .chips { margin-top: 20px; justify-content: center; }
  .chip { font-size: 14px; padding: 5px 15px; }
</style>
<div class="name"><img src="logo.svg" alt=""><h1>Nero</h1></div>
<div class="tag">A window manager <b>for GNOME</b></div>
<div class="chips"><span class="chip"><i></i>Wayland</span><span class="chip">GNOME 46–50</span><span class="chip">Rust core</span><span class="chip">Multi-monitor</span></div>
